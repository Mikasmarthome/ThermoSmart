name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Check if pre-release
        id: prerelease
        run: |
          TAG="${{ github.ref_name }}"
          # Pre-Release wenn Tag alpha, beta oder PEP-440 bN enthält (z.B. v0.9.0b1)
          if echo "$TAG" | grep -qE 'alpha|beta|b[0-9]+$'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ThermoSmart ${{ github.ref_name }}"
          body: |
            ## ThermoSmart ${{ github.ref_name }}

            ${{ steps.prerelease.outputs.is_prerelease == 'true' && '> ⚠️ **Beta-Version** – zum Testen gedacht. Bitte Feedback über [GitHub Issues](https://github.com/Mikasmarthome/ThermoSmart/issues) melden.' || '✅ **Stabile Version**' }}

            ### Installation (HACS)
            1. HACS → Integrationen → ⋮ → Benutzerdefinierte Repositories
            2. URL: `https://github.com/Mikasmarthome/ThermoSmart`
            3. Kategorie: Integration → Hinzufügen
            4. ThermoSmart installieren → Home Assistant neu starten

            ### Update
            HACS → Integrationen → ThermoSmart → Update → Home Assistant neu starten
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
