name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Check if pre-release
        id: prerelease
        run: |
          TAG="${{ github.ref_name }}"
          # Mark as pre-release if the tag contains alpha, beta, rc, or PEP-440 bN (e.g. v0.9.0b1)
          if echo "$TAG" | grep -qE 'alpha|beta|rc|b[0-9]+$'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Only creates the initial release skeleton. Re-pushing or moving a tag that
      # already has a release must never overwrite manually curated release notes,
      # so this step is skipped once a release for the tag exists.
      - name: Create Release
        if: steps.existing.outputs.found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ThermoSmart ${{ github.ref_name }}"
          body: |
            ## ThermoSmart ${{ github.ref_name }}

            ${{ steps.prerelease.outputs.is_prerelease == 'true' && '> ⚠️ **Pre-release** – for testing only. Please report issues via [GitHub Issues](https://github.com/Mikasmarthome/ThermoSmart/issues).' || '✅ **Stable release** — recommended for all users.' }}

            ### Installation (HACS)
            1. HACS → Integrations → ⋮ → Custom Repositories
            2. URL: `https://github.com/Mikasmarthome/ThermoSmart` — Category: Integration → Add
            3. Find **ThermoSmart** → Download → Restart Home Assistant
            4. Settings → Integrations → Add Integration → **ThermoSmart**

            ### Update from a previous version
            HACS → Integrations → ThermoSmart → Update → Restart Home Assistant

            > Learning data is preserved across updates.
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
