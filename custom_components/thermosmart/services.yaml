export_learning_data:
  name: Export anonymized learning data
  description: >
    Saves an anonymized snapshot of ThermoSmart learning data as
    thermosmart_research_<timestamp>_<suffix>.json in a private export
    directory. A persistent notification links to an authenticated
    download endpoint — no data is sent anywhere automatically; review
    the file and share it manually to support Learning Engine development.
    The file contains numeric learning data only; entity IDs, device names,
    and personal identifiers are never included.
  fields: {}
