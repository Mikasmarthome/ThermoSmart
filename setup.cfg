[tool:pytest]
testpaths = tests
asyncio_mode = auto
# Default log level: WARNING keeps simulation timing tests independent of log-capture I/O.
# Tests that need DEBUG logging use caplog.at_level(logging.DEBUG) locally.
log_level = WARNING
# pytest-homeassistant-custom-component loads homeassistant.runner which
# requires fcntl (Linux/Mac only). Disabled on Windows for Welle 1 tests.
# Remove the next line when running on Linux / WSL / CI for Welle 2+ HA tests.
addopts = -p no:homeassistant
