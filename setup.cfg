[tool:pytest]
testpaths = tests
asyncio_mode = auto
# pytest-homeassistant-custom-component loads homeassistant.runner which
# requires fcntl (Linux/Mac only). Disabled on Windows for Welle 1 tests.
# Remove the next line when running on Linux / WSL / CI for Welle 2+ HA tests.
addopts = -p no:homeassistant_custom_component
